<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Repository Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>GitHub Repository Explorer</h1>
            <p>Search, filter and explore GitHub repositories.</p>
        </div>

        <button id="themeButton" class="theme-button">
            🌙 Dark Mode
        </button>
    </header>


    <main class="container">

        <!-- Search -->
        <section class="search-section">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search repositories..."
                    autocomplete="off"
                >

                <button id="searchButton">
                    Search
                </button>
            </div>

            <p id="searchMessage"></p>

        </section>


        <!-- Filters -->
        <section class="controls">

            <div class="control">
                <label for="languageFilter">Language</label>

                <select id="languageFilter">
                    <option value="all">All Languages</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="C++">C++</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="Go">Go</option>
                    <option value="Rust">Rust</option>
                </select>
            </div>


            <div class="control">
                <label for="sortSelect">Sort by</label>

                <select id="sortSelect">
                    <option value="stars">Stars</option>
                    <option value="forks">Forks</option>
                    <option value="name">Name</option>
                    <option value="updated">Recently Updated</option>
                </select>
            </div>


            <button id="favoritesButton" class="secondary-button">
                ❤️ Favorites
            </button>

            <button id="compareButton" class="secondary-button">
                Compare Selected
            </button>

        </section>


        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching GitHub...</p>
        </div>


        <!-- Results -->
        <section id="results" class="results"></section>


        <!-- Pagination -->
        <div id="pagination" class="pagination hidden">

            <button id="previousButton">
                ← Previous
            </button>

            <span id="pageNumber">
                Page 1
            </span>

            <button id="nextButton">
                Next →
            </button>

        </div>

    </main>


    <!-- Repository Details Modal -->
    <div id="detailsModal" class="modal hidden">

        <div class="modal-content">

            <button id="closeModal" class="close-button">
                ×
            </button>

            <div id="detailsContent"></div>

        </div>

    </div>


    <!-- Comparison Modal -->
    <div id="compareModal" class="modal hidden">

        <div class="modal-content">

            <button id="closeCompareModal" class="close-button">
                ×
            </button>

            <h2>Repository Comparison</h2>

            <div id="comparisonContent"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
    </html>
